<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Aroma">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes rise { 0%{transform:translateY(16px);opacity:0} 30%{opacity:1} 100%{transform:translateY(-22px);opacity:0} }
.wave{animation:rise 2.6s ease-out infinite}
</style>
<defs><clipPath id="c3"><path d="M-34,-52 L34,-52 C36,-10 18,8 0,10 C-18,8 -36,-10 -34,-52 Z"/></clipPath></defs>
<g transform="translate(0,22)">
  <g clip-path="url(#c3)"><rect x="-40" y="-14" width="80" height="30" fill="#A3344F" opacity=".85"/></g>
  
<g id="glass" fill="none" stroke="#6B1F33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-34,-52 L34,-52 C36,-10 18,8 0,10 C-18,8 -36,-10 -34,-52 Z"/>
  <path d="M0,10 L0,48"/>
  <path d="M-22,52 L22,52"/>
</g>
  <path class="wave" style="animation-delay:0.0s" d="M-16,-62 c6,-8 -6,-16 0,-24 c6,-8 -6,-16 0,-24" fill="none" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/><path class="wave" style="animation-delay:0.6s" d="M0,-62 c6,-8 -6,-16 0,-24 c6,-8 -6,-16 0,-24" fill="none" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/><path class="wave" style="animation-delay:1.2s" d="M16,-62 c6,-8 -6,-16 0,-24 c6,-8 -6,-16 0,-24" fill="none" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/>
</g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">AROMA</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Aroma</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Three short sniffs.</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 3 OF 18</text>
</g>
</svg>