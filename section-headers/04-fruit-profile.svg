<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Fruit Profile">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes pop { 0%,15%{transform:scale(0);opacity:0} 30%,70%{transform:scale(1);opacity:1} 85%,100%{transform:scale(0);opacity:0} }
.pop{transform-box:fill-box;transform-origin:center;animation:pop 3.6s ease-in-out infinite}
</style>
<g transform="translate(0,16)"><circle class="pop" style="animation-delay:0.0s" cx="-42" cy="-10" r="16" fill="#E9D64C"/><path class="pop" style="animation-delay:0.0s" d="M-42,-26 q6,-8 12,-10" fill="none" stroke="#5E8B3A" stroke-width="2.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:0.5s" cx="-14" cy="-30" r="16" fill="#8FBF5A"/><path class="pop" style="animation-delay:0.5s" d="M-14,-46 q6,-8 12,-10" fill="none" stroke="#5E8B3A" stroke-width="2.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:1.0s" cx="14" cy="-10" r="16" fill="#F2A66B"/><path class="pop" style="animation-delay:1.0s" d="M14,-26 q6,-8 12,-10" fill="none" stroke="#5E8B3A" stroke-width="2.5" stroke-linecap="round"/><circle class="pop" style="animation-delay:1.5s" cx="42" cy="-30" r="16" fill="#4A1E3A"/><path class="pop" style="animation-delay:1.5s" d="M42,-46 q6,-8 12,-10" fill="none" stroke="#5E8B3A" stroke-width="2.5" stroke-linecap="round"/>
<path d="M-56,26 h112" stroke="#C9A24A" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/></g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TASTE</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Fruit Profile</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">What fruit is at the centre?</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 4 OF 18</text>
</g>
</svg>