<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Alcohol">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes merc { 0%,10%{transform:scaleY(.25)} 50%,60%{transform:scaleY(1)} 90%,100%{transform:scaleY(.25)} }
.merc{transform-box:fill-box;transform-origin:bottom;animation:merc 5s ease-in-out infinite}
@keyframes warm { 0%,10%{opacity:.2} 50%,60%{opacity:1} 90%,100%{opacity:.2} }
.warm{animation:warm 5s ease-in-out infinite}
</style>
<g transform="translate(-10,0)">
  <rect x="-12" y="-62" width="24" height="104" rx="12" fill="white" stroke="#6B1F33" stroke-width="3"/>
  <rect class="merc" x="-6" y="-52" width="12" height="80" rx="6" fill="#A3344F"/>
  <circle cy="46" r="18" fill="#A3344F" stroke="#6B1F33" stroke-width="3"/>
  <g stroke="#8C6A72" stroke-width="2"><path d="M14,-40 h8"/><path d="M14,-20 h8"/><path d="M14,0 h8"/><path d="M14,20 h8"/></g>
</g>
<text class="warm" x="40" y="-14" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#6B1F33">%</text>
<g class="warm" transform="translate(50,22)"><path d="M0,0 c4,-8 -4,-14 0,-22 c4,-8 -4,-14 0,-22" fill="none" stroke="#C9A24A" stroke-width="2.5" stroke-linecap="round"/></g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TECHNICAL ANALYSIS</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Alcohol</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Feel for the warmth.</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 11 OF 18</text>
</g>
</svg>