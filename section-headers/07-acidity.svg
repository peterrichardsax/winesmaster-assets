<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Acidity">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes zing { 0%,100%{opacity:.1;transform:scale(.9)} 50%{opacity:1;transform:scale(1.08)} }
.spark{transform-origin:0 0;animation:zing 1.6s ease-in-out infinite}
@keyframes drip { 0%{transform:translateY(0);opacity:0} 30%{opacity:1} 100%{transform:translateY(40px);opacity:0} }
.drop{animation:drip 2.2s ease-in infinite}
</style>
<g>
  <circle r="36" fill="#F3D95B" stroke="#E2BE2F" stroke-width="4"/>
  <circle r="28" fill="#FBF1B0"/>
  <g stroke="#E2BE2F" stroke-width="2">
    <path d="M0,-28 v56"/><path d="M-28,0 h56"/><path d="M-20,-20 l40,40"/><path d="M20,-20 l-40,40"/>
  </g>
  <g transform="rotate(20)"><path class="spark" style="animation-delay:0.0s" d="M0,-46 l0,-14" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(70)"><path class="spark" style="animation-delay:0.25s" d="M0,-46 l0,-14" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(120)"><path class="spark" style="animation-delay:0.5s" d="M0,-46 l0,-14" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(200)"><path class="spark" style="animation-delay:0.75s" d="M0,-46 l0,-14" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(250)"><path class="spark" style="animation-delay:1.0s" d="M0,-46 l0,-14" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(300)"><path class="spark" style="animation-delay:1.25s" d="M0,-46 l0,-14" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/></g>
  <path class="drop" d="M30,36 c6,8 6,14 0,16 c-6,-2 -6,-8 0,-16z" fill="#7FB5D6"/>
</g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TASTE</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Acidity</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">How much does your mouth water?</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 7 OF 18</text>
</g>
</svg>