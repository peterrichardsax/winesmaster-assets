<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Aftertaste">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes sweep { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.hand{animation:sweep 4s linear infinite;transform-origin:0 0}
@keyframes tail { 0%{stroke-dashoffset:120;opacity:1} 60%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
.tail{stroke-dasharray:120;animation:tail 4s ease-out infinite}
</style>
<g transform="translate(0,-6)">
  <circle r="40" fill="white" stroke="#6B1F33" stroke-width="3"/>
  <path d="M0,-40 v-10 M-8,-50 h16" stroke="#6B1F33" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#8C6A72" stroke-width="2"><path d="M0,-32 v6"/><path d="M32,0 h-6"/><path d="M0,32 v-6"/><path d="M-32,0 h6"/></g>
  <path class="hand" d="M0,0 L0,-28" stroke="#C9A24A" stroke-width="3" stroke-linecap="round"/>
  <circle r="4" fill="#6B1F33"/>
</g>
<path class="tail" d="M-44,62 h88" stroke="#A3344F" stroke-width="6" stroke-linecap="round"/></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TASTE</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Aftertaste</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Swallow and count.</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 10 OF 18</text>
</g>
</svg>