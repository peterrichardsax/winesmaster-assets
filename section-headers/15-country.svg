<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Country">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes drop { 0%{transform:translateY(-70px);opacity:0} 35%{transform:translateY(0);opacity:1} 45%{transform:translateY(-10px)} 55%,85%{transform:translateY(0)} 100%{transform:translateY(0);opacity:0} }
.pin{animation:drop 4s ease-out infinite}
@keyframes ripple { 0%,35%{transform:scale(.2);opacity:0} 50%{opacity:.8} 100%{transform:scale(1.6);opacity:0} }
.rip{transform-box:fill-box;transform-origin:center;animation:ripple 4s ease-out infinite}
</style>
<g transform="scale(.82) translate(0,-6)">
<path d="M-70,50 c20,-30 50,-30 70,-10 c20,-20 50,-20 70,10 l-10,20 h-120z" fill="#EFE6DA" stroke="#8C6A72" stroke-width="2"/>
<ellipse class="rip" cx="0" cy="40" rx="30" ry="10" fill="none" stroke="#C9A24A" stroke-width="3"/>
<g class="pin"><path d="M0,40 c-22,-24 -26,-34 -26,-46 a26,26 0 0 1 52,0 c0,12 -4,22 -26,46z" fill="#6B1F33"/><circle cy="-6" r="10" fill="#F6F1EA"/></g>
</g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TECHNICAL ANALYSIS</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Country</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Where is this style made?</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 15 OF 18</text>
</g>
</svg>