<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Vintage">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes yr { 0%{opacity:0;transform:translateY(10px)} 8%,20%{opacity:1;transform:translateY(0)} 28%,100%{opacity:0;transform:translateY(-10px)} }
.yr{animation:yr 5s ease-in-out infinite;opacity:0}
</style>
<rect x="-56" y="-46" width="112" height="96" rx="10" fill="white" stroke="#6B1F33" stroke-width="3"/>
<rect x="-56" y="-46" width="112" height="26" rx="10" fill="#6B1F33"/>
<rect x="-56" y="-30" width="112" height="10" fill="#6B1F33"/>
<g stroke="#F6F1EA" stroke-width="4" stroke-linecap="round"><path d="M-30,-54 v16"/><path d="M30,-54 v16"/></g>
<text class="yr" style="animation-delay:0.0s" x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#6B1F33">2018</text><text class="yr" style="animation-delay:1.25s" x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#6B1F33">2020</text><text class="yr" style="animation-delay:2.5s" x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#6B1F33">2022</text><text class="yr" style="animation-delay:3.75s" x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#6B1F33">2024</text></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TECHNICAL ANALYSIS</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Vintage</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Young and fresh, or developed?</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 17 OF 18</text>
</g>
</svg>