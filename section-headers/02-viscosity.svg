<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Viscosity">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes run { 0%{transform:translateY(-14px);opacity:0} 20%{opacity:.9} 100%{transform:translateY(26px);opacity:0} }
.leg{animation:run 2.4s ease-in infinite}
</style>
<defs><clipPath id="c2"><path d="M-34,-52 L34,-52 C36,-10 18,8 0,10 C-18,8 -36,-10 -34,-52 Z"/></clipPath></defs>
<g clip-path="url(#c2)">
  <rect x="-40" y="-8" width="80" height="30" fill="#A3344F" opacity=".85"/>
  <rect x="-40" y="-52" width="80" height="48" fill="#A3344F" opacity=".12"/>
  <path class="leg" style="animation-delay:0.0s" d="M-18,-40 L-18,-8" stroke="#8A2E45" stroke-width="3" stroke-linecap="round"/><path class="leg" style="animation-delay:0.45s" d="M-6,-40 L-6,-8" stroke="#8A2E45" stroke-width="3" stroke-linecap="round"/><path class="leg" style="animation-delay:0.9s" d="M6,-40 L6,-8" stroke="#8A2E45" stroke-width="3" stroke-linecap="round"/><path class="leg" style="animation-delay:1.35s" d="M18,-40 L18,-8" stroke="#8A2E45" stroke-width="3" stroke-linecap="round"/>
</g>

<g id="glass" fill="none" stroke="#6B1F33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-34,-52 L34,-52 C36,-10 18,8 0,10 C-18,8 -36,-10 -34,-52 Z"/>
  <path d="M0,10 L0,48"/>
  <path d="M-22,52 L22,52"/>
</g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">APPEARANCE</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Viscosity</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Swirl. Watch the legs.</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 2 OF 18</text>
</g>
</svg>