<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Old or New World">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes spin { from{transform:translateX(-40px)} to{transform:translateX(40px)} }
.m{animation:spin 6s linear infinite}
</style>
<defs><clipPath id="c14"><circle r="44"/></clipPath></defs>
<circle r="44" fill="#DDE9F2" stroke="#6B1F33" stroke-width="3"/>
<g clip-path="url(#c14)" fill="none" stroke="#8A2E45" stroke-width="2" opacity=".7">
  <g class="m">
    <ellipse rx="16" ry="44"/><ellipse cx="-40" rx="16" ry="44"/><ellipse cx="40" rx="16" ry="44"/><ellipse cx="-80" rx="16" ry="44"/><ellipse cx="80" rx="16" ry="44"/>
    <path d="M-120,-22 h240 M-120,22 h240"/>
  </g>
</g>
<g clip-path="url(#c14)" fill="#8FB58A" opacity=".9">
  <g class="m"><path d="M-30,-20 c10,-8 20,-2 18,10 c-2,8 -14,10 -20,2z"/><path d="M20,-6 c8,-10 22,-6 20,8 c-4,10 -18,8 -20,-8z"/><path d="M-70,10 c8,-8 18,-2 14,8 c-4,6 -14,6 -14,-8z"/><path d="M70,-24 c8,-8 18,-2 14,8 c-4,6 -14,6 -14,-8z"/></g>
</g>
<circle r="44" fill="none" stroke="#6B1F33" stroke-width="3"/></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TECHNICAL ANALYSIS</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Old or New World</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Restrained, or ripe and bold?</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 14 OF 18</text>
</g>
</svg>