<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Region">
<style>
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.t1{animation:fadeUp .8s ease-out both}
.t2{animation:fadeUp .8s .25s ease-out both}
.t3{animation:fadeUp .8s .5s ease-out both}
@keyframes rule { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
.rule{stroke-dasharray:120;animation:rule 1.2s .4s ease-out both}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1EA"/><stop offset="1" stop-color="#EFE6DA"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
</defs>
<rect width="640" height="220" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="220" fill="#6B1F33"/>
<circle cx="150" cy="110" r="96" fill="url(#halo)"/>
<circle cx="150" cy="110" r="84" fill="white" stroke="#C9A24A" stroke-width="1.5" opacity=".9"/>
<g transform="translate(150,110)">
<style>
@keyframes focus { 0%{transform:scale(1.4);opacity:0} 40%{opacity:.9} 100%{transform:scale(.3);opacity:0} }
.ring{transform-origin:0 0;animation:focus 3s ease-in infinite}
</style>
<g transform="scale(.62)">
<path d="M-80,-30 l40,-20 l50,14 l40,-10 l30,26 l-20,40 l-60,10 l-50,-14 l-40,-20z" fill="#EFE6DA" stroke="#8C6A72" stroke-width="2"/>
<circle class="ring" style="animation-delay:0.0s" r="70" fill="none" stroke="#8A2E45" stroke-width="2.5"/><circle class="ring" style="animation-delay:0.5s" r="52" fill="none" stroke="#8A2E45" stroke-width="2.5"/><circle class="ring" style="animation-delay:1.0s" r="34" fill="none" stroke="#8A2E45" stroke-width="2.5"/>
<circle r="9" fill="#C9A24A" stroke="#6B1F33" stroke-width="2.5"/>
</g></g>
<g transform="translate(292,0)">
  <text class="t1" x="0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8C6A72">TECHNICAL ANALYSIS</text>
  <text class="t2" x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#2B1A1F">Region</text>
  <path class="rule" d="M0,128 h120" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>
  <text class="t3" x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6B1F33">Narrow it down.</text>
  <text x="0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8C6A72">QUESTION 16 OF 18</text>
</g>
</svg>